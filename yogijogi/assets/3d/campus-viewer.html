<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; img-src data:">
  <style>
    html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #eaf0ea; }
    .marker { position: absolute; transform: translate(-50%, -115%); border: 0; border-radius: 24px;
      background: white; color: #172d47; padding: 10px 12px; white-space: nowrap; font: bold 12px sans-serif;
      box-shadow: 0 4px 12px #172d4738; }
    .marker:not([hidden]) { display: flex; align-items: center; gap: 6px; }
    .marker.combined::before, .marker.events::before, .marker.reports::before {
      content: ''; width: 14px; height: 14px; border-radius: 50%; background: #ff686d;
    }
    .marker.combined::before { background: linear-gradient(110deg, #ff686d 50%, #ffec64 50%); }
    .marker.events::before { background: #ffec64; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <main id="campus"></main>
  <script src="campus-viewer.js"></script>
</body>
</html>
